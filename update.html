<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MyBookList</title>
    <link rel="stylesheet" href="styles.css"/>
</head>



<body>

    <header>
        <div class="header-content">
            <h1>MyBookList</h1>

            <nav>
                <a href="index.html">My Books</a>
                <a href="create.html">Add Book</a>
                <a href="read.html">View Book</a>
                <a href="update.html">Edit Book</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Update book</h2>

        <form id="book-form">
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="insert title" value="The Courage To Be Disliked">
            </div>
    
            <div>
                <label for="author">Author</label>
                <input type="text" id="author" name="author" placeholder="insert author" value="Ichiro Kishimi, Fumitake Koga">
            </div>
    
            <div>
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="reading">Reading</option>
                    <option value="completed">Completed</option>
                    <option value="planned">Plan to read</option>
                    <option value="dropped">Dropped</option>
                    <option value="onhold">On hold</option>
                </select>
            </div>
    
            <div>
                <label for="score">Score</label>
                <select id="score" name="score">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
    
            <div>
                <label for="review">Review</label>
                <textarea id="review" name="review" rows="5" cols="40" placeholder="Insert review here"></textarea>
            </div>
    
            <div class="buttons">
                <input type="reset" value="Reset">
                <input type="submit" value="Update book">
            </div>

        </form>

    </main>

    <footer>
        <p>MyBookList</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
