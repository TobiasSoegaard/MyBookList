<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MyBookList</title>
    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <header>
        <div class="header-content">
            <h1>MyBookList</h1>

            <nav>
                <a href="index.html">My Books</a>
                <a href="create.html">Add Book</a>
                <a href="read.html">View Book</a>
                <a href="update.html">Edit Book</a>
            </nav>
        </div>
    </header>
    

    <main>
        <div class="page-header">
            <h2>My Books</h2>
            <p>My personal book collection</p>
        </div>

        <section class="book-list">

            <div class="book-entry">
                <a href="read.html">
                    <span class="book-number">1</span>
                    <span class="book-title">The Courage to Be Disliked</span>
                </a>
        
                <button class="remove-button">Remove</button>
            </div>
        
            <div class="book-entry">
                <a href="read.html">
                    <span class="book-number">2</span>
                    <span class="book-title">また、同じ夢を見ていた</span>
                </a>
        
                <button class="remove-button">Remove</button>
            </div>
        
            <div class="book-entry">
                <a href="read.html">
                    <span class="book-number">3</span>
                    <span class="book-title">Meditations</span>
                </a>
        
                <button class="remove-button">Remove</button>
            </div>
        
        </section>

        <button id="add-book">Load more</button>
    </main>

    <footer>
        <p>MyBookList</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
